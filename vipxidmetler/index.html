<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>VIP Xidmətlər – RM İDMAN KLUBU</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://yyrcsgqvkqyezopzohxb.supabase.co" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#D4AF37;--lime:#96C80A;--lime-light:#AADB1E;
      --black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;
      --gray:#888888;--gray-light:#CCCCCC;--white:#FFFFFF;
      --radius:16px;--radius-sm:8px;--transition:0.22s ease;
    }
    html{font-size:16px}
    body{font-family:'Open Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;background:none;font-family:inherit}

    /* HEADER */
    .vip-header{
      background:rgba(10,10,10,0.95);backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(150,200,10,0.2);
      padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;
    }
    .vip-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
    .vip-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover}
    .vip-logo-text{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.9rem;color:var(--lime)}
    .vip-back-btn{
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(150,200,10,0.1);border:1px solid rgba(150,200,10,0.3);
      color:var(--lime);padding:8px 16px;border-radius:50px;
      font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.82rem;
      transition:all var(--transition);
    }
    .vip-back-btn:hover{background:var(--lime);color:var(--black)}

    /* MAIN */
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}

    /* LOGIN CARD */
    .login-card{
      background:var(--dark2);border:1px solid rgba(150,200,10,0.25);
      border-radius:var(--radius);padding:40px 36px;width:100%;max-width:420px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .login-card-header{text-align:center;margin-bottom:32px}
    .login-icon{
      width:70px;height:70px;background:rgba(150,200,10,0.12);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;color:var(--lime);margin:0 auto 16px;
    }
    .login-card-header h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.5rem;color:var(--white);margin-bottom:6px}
    .login-card-header p{color:var(--gray);font-size:0.88rem}

    /* FORM */
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.8rem;color:var(--gray-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .form-input{
      width:100%;padding:13px 16px;background:var(--dark3);
      border:1px solid rgba(150,200,10,0.2);border-radius:var(--radius-sm);
      color:var(--white);font-size:0.95rem;font-family:'Open Sans',sans-serif;
      transition:border-color var(--transition);outline:none;
    }
    .form-input:focus{border-color:var(--lime)}
    .form-input::placeholder{color:var(--gray)}

    .btn-login{
      width:100%;padding:14px;background:linear-gradient(135deg,var(--lime),var(--lime-light));
      color:var(--black);border-radius:50px;font-family:'Montserrat',sans-serif;
      font-weight:800;font-size:0.95rem;letter-spacing:0.5px;
      transition:all var(--transition);margin-top:6px;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(150,200,10,0.4)}
    .btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none}

    .error-msg{
      background:rgba(227,10,23,0.12);border:1px solid rgba(227,10,23,0.3);
      color:#ff6b6b;padding:10px 14px;border-radius:var(--radius-sm);
      font-size:0.85rem;margin-bottom:16px;display:none;
      align-items:center;gap:8px;
    }
    .error-msg.show{display:flex}

    /* WELCOME SCREEN */
    .welcome-screen{display:none;text-align:center}
    .welcome-screen.show{display:block}
    .welcome-icon{
      width:80px;height:80px;background:linear-gradient(135deg,var(--lime),var(--lime-light));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:2.2rem;color:var(--black);margin:0 auto 24px;
      box-shadow:0 8px 32px rgba(150,200,10,0.4);
    }
    .welcome-title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:2.2rem;color:var(--lime);margin-bottom:12px;line-height:1.1}
    .welcome-user{color:var(--gray-light);font-size:1rem;margin-bottom:28px}
    .welcome-message-box{
      background:var(--dark3);border:1px solid rgba(150,200,10,0.2);
      border-radius:var(--radius);padding:28px;margin:20px 0;
      text-align:center;
    }
    .welcome-message-text{
      font-family:'Montserrat',sans-serif;font-weight:800;
      font-size:1.8rem;color:var(--white);line-height:1.3;
    }

    .btn-logout{
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(227,10,23,0.12);border:1px solid rgba(227,10,23,0.3);
      color:#ff6b6b;padding:11px 24px;border-radius:50px;
      font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.88rem;
      transition:all var(--transition);margin-top:8px;
    }
    .btn-logout:hover{background:rgba(227,10,23,0.25);transform:translateY(-1px)}

    /* SPINNER */
    .spinner{
      width:18px;height:18px;border:2px solid rgba(0,0,0,0.3);
      border-top-color:var(--black);border-radius:50%;
      animation:spin 0.6s linear infinite;display:none;
    }
    .btn-login.loading .spinner{display:block}
    .btn-login.loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* VIP BADGE */
    .vip-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:linear-gradient(135deg,#D4AF37,#F0D060);
      color:var(--black);padding:5px 14px;border-radius:50px;
      font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.78rem;
      letter-spacing:0.5px;margin-bottom:12px;
    }

    @media(max-width:480px){
      .login-card{padding:28px 20px}
      .welcome-title{font-size:1.8rem}
    }
  </style>
</head>
<body>

<header class="vip-header">
  <a href="/" class="vip-logo">
    <img src="../images/logo.png" alt="RM İdman Klubu" />
    <span class="vip-logo-text">RM İDMAN KLUBU</span>
  </a>
  <a href="/" class="vip-back-btn">
    <i class="fas fa-arrow-left"></i> Ana Səhifə
  </a>
</header>

<main>
  <!-- LOGIN FORM -->
  <div class="login-card" id="login-section">
    <div class="login-card-header">
      <div class="login-icon"><i class="fas fa-crown"></i></div>
      <h1>VIP Xidmətlər</h1>
      <p>Daxil olmaq üçün istifadəçi adı və parolunuzu daxil edin</p>
    </div>

    <div class="error-msg" id="error-msg">
      <i class="fas fa-exclamation-circle"></i>
      <span id="error-text">İstifadəçi adı və ya parol yanlışdır.</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">İstifadəçi Adı</label>
        <input type="text" id="username" class="form-input" placeholder="İstifadəçi adınızı daxil edin" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Parol</label>
        <input type="password" id="password" class="form-input" placeholder="Parolunuzu daxil edin" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login" id="login-btn">
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Daxil Ol</span>
        <div class="spinner"></div>
      </button>
    </form>
  </div>

  <!-- WELCOME SCREEN -->
  <div class="login-card welcome-screen" id="welcome-section">
    <div class="vip-badge"><i class="fas fa-crown"></i> VIP Üzv</div>
    <div class="welcome-icon"><i class="fas fa-star"></i></div>
    <div class="welcome-title" id="welcome-message-display">Salam</div>
    <p class="welcome-user">Xoş gəldiniz, <strong id="welcome-username"></strong>!</p>

    <div class="welcome-message-box">
      <p style="color:var(--gray);font-size:0.82rem;margin-bottom:10px;font-family:'Montserrat',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;">VIP Mesaj</p>
      <div class="welcome-message-text" id="welcome-full-message">Salam</div>
    </div>

    <button class="btn-logout" onclick="handleLogout()">
      <i class="fas fa-sign-out-alt"></i> Çıxış
    </button>
  </div>
</main>

<script>
'use strict';

var SUPABASE_URL = 'https://yyrcsgqvkqyezopzohxb.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cmNzcWd2a3F5ZXpvcHpvaHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDM4NDUsImV4cCI6MjEwMzQxOTg0NX0.Jy1LFYWSeNWx6tEf1Oxw88_n1xvb76DxnVpwKvpkCZo';

/* ---- Supabase fetch helper ---- */
function sbFetch(path, opts) {
  var url = SUPABASE_URL + path;
  var headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, opts && opts.headers || {});
  return fetch(url, Object.assign({}, opts, { headers: headers }));
}

/* ---- Session helpers ---- */
function saveSession(username) {
  sessionStorage.setItem('vip_user', username);
}
function clearSession() {
  sessionStorage.removeItem('vip_user');
}
function getSession() {
  return sessionStorage.getItem('vip_user');
}

/* ---- Show / hide sections ---- */
function showLoginSection() {
  document.getElementById('login-section').style.display = '';
  document.getElementById('welcome-section').classList.remove('show');
}
function showWelcomeSection(username, message) {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('welcome-username').textContent = username;
  document.getElementById('welcome-message-display').textContent = message || 'Salam';
  document.getElementById('welcome-full-message').textContent = message || 'Salam';
  document.getElementById('welcome-section').classList.add('show');
}

/* ---- Show error ---- */
function showError(msg) {
  var el = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('error-msg').classList.remove('show');
}

/* ---- Login handler ---- */
function handleLogin(e) {
  e.preventDefault();
  hideError();

  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Zəhmət olmasa bütün sahələri doldurun.');
    return;
  }

  var btn = document.getElementById('login-btn');
  btn.classList.add('loading');
  btn.disabled = true;

  /* Check user in Supabase */
  sbFetch('/rest/v1/vip_users?select=username,password&username=eq.' + encodeURIComponent(username))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.classList.remove('loading');
      btn.disabled = false;

      if (!data || !Array.isArray(data) || data.length === 0) {
        showError('İstifadəçi adı tapılmadı.');
        return;
      }

      var user = data[0];
      if (user.password !== password) {
        showError('Parol yanlışdır.');
        return;
      }

      /* Fetch welcome message */
      return sbFetch('/rest/v1/admin_settings?select=value&key=eq.welcome_message')
        .then(function(r) { return r.json(); })
        .then(function(settings) {
          var msg = 'Salam';
          if (settings && settings.length > 0) {
            msg = settings[0].value;
          }
          saveSession(username);
          showWelcomeSection(username, msg);
        });
    })
    .catch(function(err) {
      btn.classList.remove('loading');
      btn.disabled = false;
      showError('Xəta baş verdi. Zəhmət olmasa yenidən cəhd edin.');
      console.error(err);
    });
}

/* ---- Logout ---- */
function handleLogout() {
  clearSession();
  showLoginSection();
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

/* ---- Init: check existing session ---- */
(function init() {
  var existing = getSession();
  if (existing) {
    /* Refresh welcome message */
    sbFetch('/rest/v1/admin_settings?select=value&key=eq.welcome_message')
      .then(function(r) { return r.json(); })
      .then(function(settings) {
        var msg = 'Salam';
        if (settings && settings.length > 0) {
          msg = settings[0].value;
        }
        showWelcomeSection(existing, msg);
      })
      .catch(function() {
        showWelcomeSection(existing, 'Salam');
      });
  }
})();
</script>
</body>
</html>
